<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Learning Outcomes</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: 'Quicksand', sans-serif;
      background-color: #fff5f2;
      color: #4a3f3f;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #4a3f3f;
      font-size: 0.75rem;
      transition: transform 0.2s;
    }

    .nav-item:hover {
      transform: scale(1.1);
    }

    .nav-item img {
      width: 26px;
      height: 26px;
      margin-bottom: 5px;
      border-radius: 6px;
    }

    .main {
      margin-left: 80px;
      padding: 2rem;
    }

    h1 {
      font-size: 24px;
      font-weight: bold;
      color: #7a6262;
    }

    .line {
      border-top: 3px solid #f7b6c2;
      width: 80%;
      margin-top: 5px;
      margin-bottom: 30px;
    }

    .cards {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .card {
      width: 250px;
      height: 250px;
      background-color: #ffffff;
      border: 2px solid #fcd9e3;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(242, 215, 219, 0.4);
      text-decoration: none;
      color: #4a3f3f;
      transition: transform 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      transform: scale(1.03);
      box-shadow: 0 6px 14px rgba(242, 215, 219, 0.5);
    }

    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }

    .card p {
      padding: 0.5rem;
      margin: 0;
      font-size: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>


  <div class="main">
    <h1>Learning Outcomes</h1>
    <div class="line"></div>
    <div class="cards">
      <a href="LO1.html" class="card">
        <img src="imae2.jpg" alt="LO1">
        <p>LO1</p>
      </a>
      <a href="LO2.html" class="card">
        <img src="image.jpg" alt="LO2">
        <p>LO2</p>
      </a>
      <a href="LO3.html" class="card">
        <img src="imae2.jpg" alt="LO3">
        <p>LO3</p>
      </a>
      <a href="LO4.html" class="card">
        <img src="imae2.jpg" alt="LO4">
        <p>LO4</p>
      </a>
      <a href="LO5.html" class="card">
        <img src="imae2.jpg" alt="LO5">
        <p>LO5</p>
      </a>
    </div>
  </div>
</body>
</html>
